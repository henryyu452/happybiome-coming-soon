<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HappyBiome | Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --teal: #59d1c8;
      --teal-soft: #e6fbf8;
      --purple: #761bb4;
      --purple-soft: #f3e8ff;
      --lavender: #b990ec;
      --text: #24323a;
      --muted: #5f7077;
      --card: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 7% 13%, rgba(89, 209, 200, 0.22), transparent 32%),
        radial-gradient(circle at 92% 12%, rgba(185, 144, 236, 0.20), transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(89, 209, 200, 0.12), transparent 36%),
        linear-gradient(180deg, #ffffff 0%, #f7fffd 100%);
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 20px;
      position: relative;
    }

    .card {
      width: 100%;
      max-width: 820px;
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(89, 209, 200, 0.28);
      border-radius: 38px;
      padding: 54px 34px 46px;
      box-shadow: 0 28px 90px rgba(54, 67, 75, 0.10);
      position: relative;
      z-index: 2;
      backdrop-filter: blur(8px);
    }

    .logo {
      display: block;
      width: min(430px, 88%);
      height: auto;
      margin: 0 auto 30px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 999px;
      background: var(--teal-soft);
      color: var(--purple);
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 0.01em;
      margin-bottom: 22px;
    }

    .pill-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--teal);
    }

    h1 {
      max-width: 720px;
      margin: 0 auto 18px;
      font-size: clamp(42px, 6.5vw, 76px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      color: var(--purple);
      font-weight: 900;
    }

    .subhead {
      max-width: 650px;
      margin: 0 auto;
      font-size: clamp(19px, 2.3vw, 24px);
      line-height: 1.55;
      color: var(--muted);
      font-weight: 600;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 26px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 900;
      font-size: 16px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .primary {
      background: var(--purple);
      color: white;
      box-shadow: 0 14px 30px rgba(118, 27, 180, 0.22);
    }

    .secondary {
      background: white;
      color: var(--purple);
      border: 1px solid rgba(118, 27, 180, 0.18);
    }

    .note {
      margin-top: 28px;
      font-size: 15px;
      color: #73858b;
      font-weight: 600;
    }

    .bubble,
    .plus {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }

    .bubble {
      border-radius: 999px;
    }

    .b1 {
      width: 18px;
      height: 18px;
      background: var(--teal);
      top: 18%;
      left: 16%;
    }

    .b2 {
      width: 32px;
      height: 32px;
      background: var(--lavender);
      top: 15%;
      right: 15%;
    }

    .b3 {
      width: 14px;
      height: 14px;
      background: var(--teal);
      bottom: 22%;
      right: 22%;
    }

    .b4 {
      width: 24px;
      height: 24px;
      background: var(--purple);
      bottom: 24%;
      left: 17%;
    }

    .plus {
      color: var(--teal);
      font-size: 54px;
      font-weight: 900;
      line-height: 1;
    }

    .p1 {
      top: 7%;
      right: 23%;
    }

    .p2 {
      bottom: 20%;
      left: 11%;
    }

    @media (max-width: 640px) {
      .page {
        padding: 28px 14px;
      }

      .card {
        padding: 38px 20px 34px;
        border-radius: 30px;
      }

      .logo {
        width: min(330px, 92%);
        margin-bottom: 24px;
      }

      .actions {
        flex-direction: column;
        margin-top: 28px;
      }

      .button {
        width: 100%;
      }

      .bubble,
      .plus {
        opacity: 0.45;
      }

      .b1 {
        left: 5%;
      }

      .b2 {
        right: 6%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="plus p1">+</div>
    <div class="plus p2">+</div>

    <section class="card">
      <img class="logo" src="./logo.png" alt="HappyBiome logo" />

      <div class="pill">
        <span class="pill-dot"></span>
        Coming Soon
      </div>

      <h1>A happier gut starts here.</h1>

      <p class="subhead">
        HappyBiome is building personalized gut health insights for families,
        starting with easy at-home stool testing and clear, actionable recommendations.
      </p>

      <div class="actions">
        <a class="button primary" href="mailto:hello@happybiome.com">
          Contact Us
        </a>

        <a class="button secondary" href="mailto:hello@happybiome.com?subject=HappyBiome%20Waitlist">
          Join the Waitlist
        </a>
      </div>

      <div class="note">
        Website launching soon.
      </div>
    </section>
  </main>
</body>
</html>
